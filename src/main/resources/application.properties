spring.application.name=result-service
server.port=${SERVER_PORT:8083}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${RESULTS_DB_URL:jdbc:postgresql://localhost:5432/votivo_results}
spring.datasource.username=${RESULTS_DB_USER:votivo_results}
spring.datasource.password=${RESULTS_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
